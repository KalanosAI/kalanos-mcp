<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">From published evidence to a verified LeRobot input</title>
<desc id="desc">Fetch the report and episode decisions, verify a pinned local dataset, preview pass-only selection, export JSON artifacts, and check actual LeRobot loading. Review, blocked and unknown decisions remain held out. No training is launched.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b8096"/></marker></defs>
<rect width="1200" height="460" rx="18" fill="#f4f7fb"/>
<text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#152b42" font-weight="700">Your evidence-to-loader workflow</text>
<text x="34" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4e6379">Published assessment + pinned source data. Reproducible episode selection.</text>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(34 112)"><rect width="208" height="216" rx="12" fill="#fff" stroke="#c8d5e2"/><circle cx="30" cy="34" r="16" fill="#d9f5ee"/><text x="30" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#126a58">1</text><text x="56" y="42" font-size="24" font-weight="700" fill="#152b42">Collect</text><text x="18" y="86" font-size="19" fill="#344d65">Report + all</text><text x="18" y="111" font-size="19" fill="#344d65">episode decision</text><text x="18" y="136" font-size="19" fill="#344d65">pages</text><rect x="12" y="164" width="184" height="38" rx="7" fill="#edf3f9"/><text x="24" y="189" font-size="18" fill="#344d65">mcp-bundle.json</text></g>
<g transform="translate(264 112)"><rect width="208" height="216" rx="12" fill="#fff" stroke="#c8d5e2"/><circle cx="30" cy="34" r="16" fill="#d9f5ee"/><text x="30" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#126a58">2</text><text x="56" y="42" font-size="24" font-weight="700" fill="#152b42">Verify</text><text x="18" y="86" font-size="19" fill="#344d65">Pinned local</text><text x="18" y="111" font-size="19" fill="#344d65">checkout + source</text><text x="18" y="136" font-size="19" fill="#344d65">episode IDs</text><rect x="12" y="164" width="184" height="38" rx="7" fill="#edf3f9"/><text x="24" y="189" font-size="18" fill="#344d65">Exact revision</text></g>
<g transform="translate(494 112)"><rect width="208" height="216" rx="12" fill="#e9f7f3" stroke="#65bda7"/><circle cx="30" cy="34" r="16" fill="#176f5c"/><text x="30" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3</text><text x="56" y="42" font-size="24" font-weight="700" fill="#152b42">Select</text><text x="18" y="86" font-size="19" fill="#344d65">Preview counts</text><text x="18" y="111" font-size="19" fill="#344d65">Include explicit</text><text x="18" y="136" font-size="19" fill="#344d65">pass</text><rect x="12" y="164" width="184" height="38" rx="7" fill="#d2eee4"/><text x="24" y="189" font-size="18" fill="#1d6654">selection.json</text></g>
<g transform="translate(724 112)"><rect width="208" height="216" rx="12" fill="#fff" stroke="#c8d5e2"/><circle cx="30" cy="34" r="16" fill="#d9f5ee"/><text x="30" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#126a58">4</text><text x="56" y="42" font-size="24" font-weight="700" fill="#152b42">Hand off</text><text x="18" y="86" font-size="19" fill="#344d65">LeRobot arguments</text><text x="18" y="111" font-size="19" fill="#344d65">+ selection</text><text x="18" y="136" font-size="19" fill="#344d65">provenance</text><rect x="12" y="164" width="184" height="38" rx="7" fill="#edf3f9"/><text x="24" y="189" font-size="18" fill="#344d65">lerobot-input.json</text></g>
<g transform="translate(954 112)"><rect width="208" height="216" rx="12" fill="#fff" stroke="#c8d5e2"/><circle cx="30" cy="34" r="16" fill="#d9f5ee"/><text x="30" y="41" text-anchor="middle" font-size="19" font-weight="700" fill="#126a58">5</text><text x="56" y="42" font-size="24" font-weight="700" fill="#152b42">Load check</text><text x="18" y="86" font-size="19" fill="#344d65">Episode / frame</text><text x="18" y="111" font-size="19" fill="#344d65">counts + sampled</text><text x="18" y="136" font-size="19" fill="#344d65">video</text><rect x="12" y="164" width="184" height="38" rx="7" fill="#edf3f9"/><text x="24" y="189" font-size="18" fill="#344d65">smoke-result.json</text></g>
<rect x="34" y="352" width="1128" height="84" rx="10" fill="#e6edf5"/>
<text x="54" y="386" font-size="21" font-weight="700" fill="#213f59">Held out separately: review · blocked · unknown</text>
<text x="54" y="418" font-size="19" fill="#4e6379">Original dataset files stay unchanged. This workflow does not launch training.</text>
</g>

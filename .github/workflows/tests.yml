name: Integration tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integrations: ${{ steps.find.outputs.integrations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: find
        run: |
          list=$(python3 -c "import json, pathlib; print(json.dumps(sorted(p.parent.name for p in pathlib.Path('integrations').glob('*/pyproject.toml'))))")
          echo "integrations=$list" >> "$GITHUB_OUTPUT"
  test:
    needs: discover
    if: needs.discover.outputs.integrations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        integration: ${{ fromJson(needs.discover.outputs.integrations) }}
    defaults:
      run:
        working-directory: integrations/${{ matrix.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.7
      - run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest
  tests:
    # The one required check; it stays valid as integrations are added or removed.
    if: always()
    needs: [discover, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DISCOVER: ${{ needs.discover.result }}
      TEST: ${{ needs.test.result }}
    steps:
      - run: |
          [ "$DISCOVER" = success ] && { [ "$TEST" = success ] || [ "$TEST" = skipped ]; }
